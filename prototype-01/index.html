<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The F Ward | Interactive Prototype 01</title>
<link rel="stylesheet" href="./pannellum.css"><script src="./pannellum.js"></script>
<style>
:root{color-scheme:dark;--paper:#e9dfc8;--ink:#0b1010}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Georgia,serif;background:#070b0b;color:var(--paper)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:4px}
#exterior,#tour{position:fixed;inset:0}#exterior{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,#293532 0%,#101a19 45%,#050808 100%);text-align:center;padding:24px}#exterior:before{content:"";position:absolute;inset:0;opacity:.18;background:repeating-linear-gradient(0deg,transparent 0 39px,#8e9a8a 40px 41px),repeating-linear-gradient(90deg,transparent 0 79px,#8e9a8a 80px 81px);pointer-events:none}.exterior-content{position:relative;max-width:650px}.eyebrow{font:12px 'Courier New',monospace;letter-spacing:.25em;text-transform:uppercase;color:#c1bba9}h1{font-size:clamp(3rem,10vw,7rem);letter-spacing:.04em;margin:12px 0}p{line-height:1.6}.action{border:1px solid #d6c7a7;background:rgba(12,18,17,.8);color:var(--paper);padding:13px 22px;text-transform:uppercase;font:700 13px 'Courier New',monospace;letter-spacing:.13em}.action:hover{background:#eee2c8;color:#111}#tour{visibility:hidden;opacity:0;transition:opacity .6s ease}#tour.active{visibility:visible;opacity:1}#panorama{position:absolute;inset:0;transition:filter .35s ease,transform .35s ease}#tour.modal-open #panorama{filter:blur(9px) brightness(.48);transform:scale(1.025)}#tour-header{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;background:rgba(0,0,0,.68);padding:9px 14px;font:700 12px 'Courier New',monospace;letter-spacing:.12em;text-align:center}#exit{position:absolute;z-index:5;bottom:18px;left:18px}#hint{position:absolute;z-index:5;bottom:22px;right:16px;background:rgba(0,0,0,.75);padding:10px 12px;font:12px 'Courier New',monospace;max-width:240px}#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20;transition:opacity .45s ease}#fade.on{opacity:1;pointer-events:auto}
/* Pannellum hotspot: an always-visible, keyboard-focusable marker. */
.pnlm-hotspot-base.fward-hotspot{width:38px;height:38px;margin:-19px 0 0 -19px;border:2px solid rgba(255,255,255,.9);border-radius:50%;background:rgba(15,25,24,.72);box-shadow:0 0 0 4px rgba(255,255,255,.12),0 0 16px rgba(255,255,255,.38);cursor:pointer;display:grid;place-items:center;color:white;font:700 23px Arial,sans-serif;transition:box-shadow .2s,background .2s,transform .2s}.pnlm-hotspot-base.fward-hotspot:hover,.pnlm-hotspot-base.fward-hotspot:focus-visible{background:rgba(255,255,255,.26);box-shadow:0 0 0 5px rgba(255,255,255,.28),0 0 25px #fff;transform:scale(1.12)}.fward-hotspot:after{content:'+'}.fward-hotspot[data-label]:before{content:attr(data-label);position:absolute;bottom:48px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,.86);border:1px solid #d3c7ad;padding:6px 9px;color:white;font:12px 'Courier New',monospace;letter-spacing:.03em}
#modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.35)}#modal.open{display:flex}.file-window{position:relative;width:min(780px,100%);max-height:90vh;overflow:auto;background:#e4d7b7;color:#27241c;border:9px solid #514a3d;box-shadow:0 22px 70px #000;padding:clamp(18px,4vw,40px)}.file-top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid #5d5446;padding-bottom:12px;font:700 12px 'Courier New',monospace;letter-spacing:.13em}.close{background:none;border:1px solid #5d5446;color:#27241c;padding:6px 10px;font:700 18px Arial}.file-window h2{font-size:clamp(1.6rem,5vw,2.8rem);margin:22px 0 4px}.file-number{font:13px 'Courier New',monospace;letter-spacing:.15em;color:#6d4a35}.file-photo{margin:20px 0;padding:30px;min-height:170px;display:grid;place-items:center;text-align:center;background:repeating-linear-gradient(-12deg,#c7b999,#c7b999 2px,#d1c4a7 3px,#d1c4a7 8px);border:1px solid #a99b7d;font:700 24px 'Courier New',monospace}.file-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:22px}.file-nav button{border:1px solid #5d5446;background:transparent;padding:10px 14px;color:#28251e;font:700 12px 'Courier New',monospace}.file-nav button:hover{background:#c4b18a}#counter{font:12px 'Courier New',monospace}#status{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#111;padding:7px 10px;color:#fff;font:12px 'Courier New',monospace;z-index:8;display:none}@media(max-width:600px){#tour-header{top:8px;font-size:10px;white-space:nowrap}#hint{bottom:70px;right:8px;font-size:10px}#exit{bottom:14px;left:10px}.fward-hotspot[data-label]:before{font-size:10px;white-space:normal;min-width:90px;text-align:center}.file-window{padding:15px;border-width:5px}}
</style>
</head>
<body>
<section id="exterior" aria-label="Temporary hospital exterior homepage"><div class="exterior-content"><div class="eyebrow">Forward Originals · Interactive test</div><h1>THE F WARD</h1><p>Hospital exterior placeholder — we'll replace this with your KeyShot exterior rendering later.</p><button id="enter" class="action">Enter Hospital</button><p class="eyebrow">Admissions are now open.</p></div></section>
<section id="tour" aria-label="Interactive hospital hallway"><div id="panorama"></div><div id="tour-header">THE F WARD · HALLWAY TEST</div><button id="exit" class="action">← Exit Hospital</button><div id="hint">Drag to look around · Click the glowing markers to explore</div><div id="status" role="status"></div></section>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="file-title"><div class="file-window"><div class="file-top"><span id="modal-type">PATIENT RECORDS / ARCHIVE</span><button id="close" class="close" aria-label="Close file">×</button></div><div class="file-number" id="file-number"></div><h2 id="file-title"></h2><div class="file-photo" id="file-photo"></div><p id="file-copy"></p><div class="file-nav"><button id="prev">← Previous</button><span id="counter"></span><button id="next">Next →</button></div></div></div><div id="fade" aria-hidden="true"></div>
<script>
'use strict';
// EDIT THESE FIRST after testing. Pannellum uses pitch and yaw in degrees.
// Test markers are approximate; use the calibration instructions in README.txt.
const HOTSPOTS=[
 {pitch:-1,yaw:-148,label:'Patient Records · test',action:'records'},
 {pitch:-1,yaw:125,label:'Administration · test',action:'about'},
 {pitch:-2,yaw:-18,label:'Explore this door · test',action:'storage'},
 {pitch:-3,yaw:0,label:'Hallway exit · test',action:'exit'}
];
const RECORDS=[
 {number:'FW-001',name:'PATIENT 001',photo:'PATIENT PORTRAIT\nPLACEHOLDER',copy:'Status: Active. Case notes, patient photograph, and all Photoshop-designed artwork will appear here.'},
 {number:'FW-002',name:'PATIENT 002',photo:'PERSONNEL FILE\nPLACEHOLDER',copy:'Observation: Unusual dedication to creative work. Additional evaluation recommended.'},
 {number:'FW-003',name:'PATIENT 003',photo:'CONFIDENTIAL\nPLACEHOLDER',copy:'Classification: Staff / Patient. Further information pending.'}
];
const PAGES={about:{number:'DEPARTMENT 01',name:'ADMINISTRATION',photo:'ABOUT US\nPLACEHOLDER',copy:'This will eventually connect to your professional About Us page.'},storage:{number:'DEPARTMENT 05',name:'ARTIFACT STORAGE',photo:'COLLECTIBLES\nPLACEHOLDER',copy:'This will eventually become an interactive collection of props and models.'}};
const $=id=>document.getElementById(id);let viewer=null,current=0,activeItems=RECORDS,lastFocus=null;
function fadeSwitch(fn){$('fade').classList.add('on');setTimeout(()=>{fn();requestAnimationFrame(()=>{$('fade').classList.remove('on')})},470)}
function showTour(){fadeSwitch(()=>{$('exterior').style.display='none';$('tour').classList.add('active');if(!viewer)initViewer();else viewer.resize()})}
function exitTour(){closeModal();fadeSwitch(()=>{$('tour').classList.remove('active');$('exterior').style.display='grid'})}
function createMarker(div,args){div.classList.add('fward-hotspot');div.dataset.label=args.label;div.setAttribute('role','button');div.setAttribute('tabindex','0');div.setAttribute('aria-label',args.label);const run=()=>{if(args.action==='exit')exitTour();else if(args.action==='records')openModal(RECORDS,'PATIENT RECORDS / ARCHIVE');else openModal([PAGES[args.action]],'DEPARTMENT / PREVIEW')};div.addEventListener('click',run);div.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();run()}})}
function initViewer(){try{viewer=pannellum.viewer('panorama',{type:'equirectangular',panorama:'./scary_hospital_hallway.jpg',autoLoad:true,autoRotate:0,compass:false,showControls:true,hfov:100,minHfov:50,maxHfov:120,yaw:125,pitch:0,orientationChangeRequired:false,deviceOrientation:false,hotSpots:HOTSPOTS.map(h=>({...h,createTooltipFunc:createMarker,createTooltipArgs:h}))});viewer.on('error',()=>{const s=$('status');s.textContent='Panorama could not load. Check file paths and use a web server.';s.style.display='block'})}catch(e){console.error(e);const s=$('status');s.textContent='Pannellum could not start. Check that pannellum.js is in the same folder.';s.style.display='block'}}
function openModal(items,type){lastFocus=document.activeElement;activeItems=items;current=0;$('modal-type').textContent=type;$('tour').classList.add('modal-open');$('modal').classList.add('open');renderFile();$('close').focus()}
function renderFile(){const x=activeItems[current];$('file-number').textContent=x.number;$('file-title').textContent=x.name;$('file-photo').textContent=x.photo;$('file-photo').style.whiteSpace='pre-line';$('file-copy').textContent=x.copy;$('counter').textContent=`${current+1} / ${activeItems.length}`;$('prev').disabled=activeItems.length<2;$('next').disabled=activeItems.length<2}
function closeModal(){$('modal').classList.remove('open');$('tour').classList.remove('modal-open');if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$('enter').addEventListener('click',showTour);$('exit').addEventListener('click',exitTour);$('close').addEventListener('click',closeModal);$('prev').addEventListener('click',()=>{current=(current-1+activeItems.length)%activeItems.length;renderFile()});$('next').addEventListener('click',()=>{current=(current+1)%activeItems.length;renderFile()});$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(!$('modal').classList.contains('open'))return;if(e.key==='Escape')closeModal();if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();if(e.key==='Tab'){const nodes=[$('close'),$('prev'),$('next')].filter(el=>!el.disabled);const i=nodes.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();nodes[nodes.length-1].focus()}else if(!e.shiftKey&&i===nodes.length-1){e.preventDefault();nodes[0].focus()}}});
</script>
</body></html>
