<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scary Hospital Hallway 3D Tour</title>
    
    <!-- Pannellum CSS & JS from CDN -->
    <link rel="stylesheet" href="https://jsdelivr.net"/>
    <script type="text/javascript" src="https://jsdelivr.net"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-box-sizing: border-box;
        }
        html, body, #panorama {
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        /* Spooky Intro Overlay */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a0505 0%, #000000 100%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #8b0000;
            text-align: center;
            transition: opacity 1.5s ease;
        }
        #intro-overlay h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(139, 0, 0, 0.7);
        }
        #enter-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #8b0000;
            padding: 12px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(139, 0, 0, 0.5);
        }
        #enter-btn:hover {
            background-color: #8b0000;
            box-shadow: 0 0 20px #8b0000;
            color: black;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Spooky Splash Screen -->
    <div id="intro-overlay">
        <h1>STAY OUT OF THE HALLWAY</h1>
        <button id="enter-btn" onclick="startTour()">ENTER TOUR</button>
    </div>

        <!-- The 3D Panorama Container -->
    <div id="panorama"></div>

    <script>
        // Global error suppression for rogue Safari/Extension issues
        window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && event.reason.message && event.reason.message.includes('Not implemented')) {
                event.preventDefault();
            }
        });

        function startTour() {
            // 1. Immediately hide the intro screen elements
            const overlay = document.getElementById('intro-overlay');
            if (overlay) {
                overlay.style.opacity = 0;
                setTimeout(function() { 
                    overlay.style.display = 'none'; 
                }, 1500);
            }

            // 2. Safely initialize Pannellum 
            try {
                pannellum.viewer('panorama', {
                    "type": "base",
                    "panorama": "/hospital-assets/scary_hospital_hallway.219.jpg",
                    "autoLoad": true,
                    "autoRotate": -1.5,
                    "compass": false,
                    "showControls": true,
                    "hfov": 100,
                    "minHfov": 50,
                    "maxHfov": 120,
                    "orientationChangeRequired": false, 
                    "deviceOrientation": false,
                    "crossOrigin": "anonymous"
                });
            } catch (error) {
                console.log("Pannellum initialization safely handled:", error);
            }
        }
    </script>

</body>
</html>
